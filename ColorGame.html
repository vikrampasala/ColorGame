<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .info {
            text-align: center;
            margin-bottom: 20px;
        }

        .instruction {
            font-size: 14px;
            margin-bottom: 10px;
            color: #666;
        }

        .color-code {
            font-size: 20px;
            font-weight: bold;
            background: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 16px;
            color: #333;
        }

        .color-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 30px 0;
        }

        .color-box {
            width: 100%;
            height: 80px;
            border: 2px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .color-box:hover {
            border-color: #333;
        }

        .message {
            text-align: center;
            font-size: 16px;
            margin: 20px 0;
            height: 20px;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        select, button {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        select {
            flex: 1;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
        }

        button:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Color Game</h1>

        <div class="info">
            <p class="instruction">Pick the matching color</p>
            <div class="color-code" id="colorCode">rgb(255, 0, 0)</div>
            <p class="score">Score: <span id="score">0</span>/5</p>
        </div>

        <div class="color-grid" id="colorGrid"></div>

        <div class="message" id="message"></div>

        <div class="controls">
            <select id="difficulty">
                <option value="easy">Easy (3 colors)</option>
                <option value="medium">Medium (5 colors)</option>
                <option value="hard">Hard (7 colors)</option>
            </select>
            <button id="newGameBtn">New Game</button>
        </div>
    </div>

    <script>
        const game = {
            score: 0,
            maxRounds: 5,
            difficulty: 'easy'
        };

        const colors = {
            easy: [
                { r: 255, g: 0, b: 0 },
                { r: 0, g: 255, b: 0 },
                { r: 0, g: 0, b: 255 }
            ],
            medium: [
                { r: 255, g: 0, b: 0 },
                { r: 0, g: 255, b: 0 },
                { r: 0, g: 0, b: 255 },
                { r: 255, g: 255, b: 0 },
                { r: 255, g: 0, b: 255 }
            ],
            hard: [
                { r: 255, g: 0, b: 0 },
                { r: 0, g: 255, b: 0 },
                { r: 0, g: 0, b: 255 },
                { r: 255, g: 255, b: 0 },
                { r: 255, g: 0, b: 255 },
                { r: 0, g: 255, b: 255 },
                { r: 128, g: 128, b: 128 }
            ]
        };

        let roundCount = 0;
        let correctColor = null;
        let options = [];

        function startGame() {
            game.score = 0;
            roundCount = 0;
            game.difficulty = document.getElementById('difficulty').value;
            nextRound();
        }

        function nextRound() {
            if (roundCount >= game.maxRounds) {
                document.getElementById('message').textContent = 'Game Over! Score: ' + game.score + '/5';
                document.getElementById('colorGrid').innerHTML = '';
                return;
            }

            roundCount++;
            document.getElementById('message').textContent = '';
            
            const palette = colors[game.difficulty];
            correctColor = palette[Math.floor(Math.random() * palette.length)];
            options = [...palette].sort(() => Math.random() - 0.5);
            
            document.getElementById('colorCode').textContent = `rgb(${correctColor.r}, ${correctColor.g}, ${correctColor.b})`;
            document.getElementById('score').textContent = game.score;
            
            displayColors();
        }

        function displayColors() {
            const grid = document.getElementById('colorGrid');
            grid.innerHTML = '';
            
            options.forEach((color, index) => {
                const box = document.createElement('div');
                box.className = 'color-box';
                box.style.backgroundColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
                box.onclick = () => checkColor(color);
                grid.appendChild(box);
            });
        }

        function checkColor(color) {
            if (color.r === correctColor.r && color.g === correctColor.g && color.b === correctColor.b) {
                game.score++;
                document.getElementById('message').textContent = 'Correct!';
                document.getElementById('message').className = 'correct';
            } else {
                document.getElementById('message').textContent = 'Wrong!';
                document.getElementById('message').className = 'incorrect';
            }
            
            setTimeout(nextRound, 1000);
        }

        document.getElementById('difficulty').addEventListener('change', startGame);
        document.getElementById('newGameBtn').addEventListener('click', startGame);
        
        startGame();
    </script>
</body>
</html>
